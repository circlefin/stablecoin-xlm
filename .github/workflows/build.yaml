name: Build & Test
on:
  workflow_call:
    inputs:
      push:
        description: "Whether this is a push to the default branch (enables release-sbom)"
        type: boolean
        default: false
        required: false

jobs:
  rust_build:
    name: Rust Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Rust
        run: ./soroban/scripts/setup-rust.sh

      - name: Run format check
        run: cargo fmt --manifest-path soroban/Cargo.toml --all -- --check

      - name: Run clippy
        run: cargo clippy --manifest-path soroban/Cargo.toml --all-targets --all-features -- --deny warnings

      - name: Build contracts
        run: cargo build --manifest-path soroban/Cargo.toml --target wasm32v1-none --release

      - name: Cache build artifacts
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            soroban/target
          key: rust-build-${{ github.sha }}

  rust_tests:
    name: Rust Tests
    needs: rust_build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Rust
        run: ./soroban/scripts/setup-rust.sh

      - name: Restore build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            soroban/target
          key: rust-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run tests
        run: cargo test --manifest-path soroban/Cargo.toml

  rust_coverage:
    name: Rust Coverage
    needs: rust_build
    runs-on: ubuntu-latest
    env:
      MINIMUM_COVERAGE_PERCENT: 90
    steps:
      - name: Check out repository code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Rust
        run: ./soroban/scripts/setup-rust.sh

      - name: Install llvm-tools-preview component
        run: rustup component add llvm-tools-preview

      - name: Restore build cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            soroban/target
          key: rust-build-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check coverage threshold
        run: |
          cargo llvm-cov --manifest-path soroban/Cargo.toml --all-features --workspace --fail-under-lines ${{ env.MINIMUM_COVERAGE_PERCENT }}

      - name: Generate HTML coverage report for debugging
        run: |
          cargo llvm-cov --manifest-path soroban/Cargo.toml --all-features --workspace --html
        if: failure()

      - name: Upload HTML report as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: soroban/target/llvm-cov/html/
        if: failure()

  scan:
    name: PR Scan
    if: ${{ !inputs.push }}
    uses: circlefin/circle-public-github-workflows/.github/workflows/pr-scan.yaml@v1
    with:
      allow-reciprocal-licenses: false

  release_sbom:
    name: Release SBOM
    if: ${{ inputs.push }}
    uses: circlefin/circle-public-github-workflows/.github/workflows/attach-release-assets.yaml@v1