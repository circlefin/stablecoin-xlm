name: stablecoin-xlm PR Pipeline
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  checks: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/build.yaml
    with:
      push: false

  rollup_results:
    runs-on: ubuntu-latest
    name: Build Success Rollup
    if: ${{ always() }}
    needs:
      - ci
    steps:
      - run: |
          ci_failure="${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}"
          if [[ $ci_failure == "true" ]]; then
            echo "Some required jobs were unsuccessful!"
            exit 1
          else
            echo "All builds/tests completed successfully."
            exit 0
          fi
