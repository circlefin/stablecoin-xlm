[package]
name = "simple-role-macros"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

[dev-dependencies]
simple-role = { path = "../simple-role", features = ["testutils"] }
soroban-sdk = { workspace = true, features = ["testutils"] }
